[project]
name = "monitor-legislativo-backend"
version = "0.1.0"
description = "Backend do MVP de monitoramento legislativo"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "psycopg[binary]>=3.1.18",
  "pydantic>=2.0",
  "pydantic-settings>=2.2.1",
  "httpx>=0.28.1",
  "sqlmodel>=0.0.16",
  "uvicorn[standard]",
  "bcrypt>=4.0.0",
  "python-jose[cryptography]>=3.3.0",
  "redis>=7.4.0",
  "sqlalchemy>=2.0.49",
  "celery>=5.6.3",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.3.0",
  "pytest-cov",
  "pytest-xdist>=3.8.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "integration: testes que chamam APIs externas (rodar com -m integration)",
]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "-n", "auto",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
