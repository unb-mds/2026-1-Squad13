name: Cron — Recálculo de Baselines

on:
  schedule:
    # 03h00 BRT = 06h00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar recálculo de baselines
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_BACKEND_URL }}/internal/tarefas/baselines" \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_API_SECRET }}" \
            --max-time 120)

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Baselines falharam com HTTP $HTTP_STATUS"
            exit 1
          fi
