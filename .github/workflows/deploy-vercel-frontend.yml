# Deploy do frontend para Vercel via CLI no GitHub Actions.
#
# Por que CLI em vez de integração nativa Vercel-GitHub?
# O repositório pertence a uma organização GitHub cujo owner é o professor.
# A integração nativa do Vercel exige permissão de instalação do OAuth App
# na organização, o que está fora do controle do time. A solução adotada é
# autenticar via VERCEL_TOKEN (gerado na conta pessoal do usuário) e disparar
# o deploy diretamente pelo CLI dentro deste workflow.
#
# Secrets necessários (configurar em Settings > Secrets > Actions do repositório):
#   VERCEL_TOKEN       — token pessoal gerado em vercel.com/account/tokens
#   VERCEL_ORG_ID      — ID da conta/organização Vercel (vercel.com/account)
#   VERCEL_PROJECT_ID  — ID do projeto Vercel (Settings > General do projeto)
#   RENDER_BACKEND_URL — URL base do backend no Render (já cadastrado nos workflows de cron)

name: Deploy Frontend — Vercel

on:
  push:
    branches:
      - feat/migracao-infra-gratuita
    paths:
      - frontend/**

jobs:
  deploy:
    name: Build e Deploy (Vercel CLI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Pull configuração do projeto Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL: ${{ secrets.RENDER_BACKEND_URL }}

      - name: Deploy para produção
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
